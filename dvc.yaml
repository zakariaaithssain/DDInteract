stages:
  build_features:
    cmd: uv run python -m src.build_features
    deps:
      - data/chemical_ddi.csv
      - src/build_features.py
      - src/features.py
      - src/config.py
    outs:
      - data/features.npy
      - data/labels.npy

  search_hyperparams:
    cmd: uv run python -m src.search_hyperparams
    deps:
      - data/features.npy
      - data/labels.npy
      - src/search_hyperparams.py
      - src/config.py
      - src/evaluate.py
      - src/features.py
    outs:
      - models/best_params.json
      - trials_leaderboard.json

  train:
    cmd: uv run python -m src.train
    deps:
      - data/features.npy
      - data/labels.npy
      - models/best_params.json
      - src/train.py
      - src/config.py
      - src/evaluate.py
      - src/export_model.py
    outs:
      - models/best_model.joblib
